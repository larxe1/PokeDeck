name: Android CI Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and assemble debug APK
        run: chmod +x gradlew && ./gradlew testDebugUnitTest assembleDebug

      - name: Package Obtainium APK
        run: |
          mkdir -p release-apk
          TAG_OR_VER="${GITHUB_REF_NAME:-main}"
          cp app/build/outputs/apk/debug/app-debug.apk "release-apk/PokeDeck-${TAG_OR_VER}.apk"

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokedeck-apk
          path: release-apk/PokeDeck-*.apk

      - name: Publish GitHub Release for Obtainium
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-apk/PokeDeck-*.apk
          generate_release_notes: true
